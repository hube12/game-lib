[package]
name = "gamelib-gui"
version = "0.0.0"
authors = ["Neil <neilhube12@gmail.com>"]
edition = "2024"
description = "Game-agnostic GUI layer for gamelib: sessions, snapshots, a JSON protocol and shared web components"
publish = false

[features]
default = []
## A tiny HTTP server for developing the web UI without a webview.
serve = ["dep:tiny_http"]

[dependencies]
gamelib = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
gamelib-toy = { path = "../games/toy" }
